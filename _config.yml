    - label: "WU LAB"
      icon: "fas fa-fw fa-flask"
      url: "https://longjunwulab.org/"

# Page defaults -------------------------------------------------------------
defaults:
  - scope:
      path: ''
      type: pages
    values:
      title: ''
      layout: single
      classes:
        - wide
        - fullwidth
